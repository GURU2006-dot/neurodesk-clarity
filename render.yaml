services:
  - type: web
    name: neurodesk-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        scope: runtime
        sync: false
      - key: GOOGLE_CLIENT_ID
        scope: runtime
        sync: false
      - key: ADMIN_EMAILS
        scope: runtime
        sync: false
